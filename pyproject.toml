[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopper-memory"
dynamic = ["version"]
description = "Persistent memory and task management for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hopper Team"},
]
keywords = ["task-routing", "orchestration", "ai-agents", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # CLI framework
    "click>=8.1.7",
    "rich>=13.7.0",
    # Config and validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Local storage
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    # HTTP client (server-mode CLI, MCP bridge, GitHub platform)
    "httpx>=0.25.0",
    # MCP server (primary use case for Claude Desktop / Claude Code)
    # Requires >=1.0.0 for SSE transport support (includes starlette, sse-starlette)
    # <2.0.0: mcp 2.x renamed FastMCP -> MCPServer and changed other APIs
    # (mcp.server.sse, mcp.server.streamable_http*) that src/hopper/api/mcp_sse/
    # and src/hopper/mcp/ import directly. An unpinned upper bound let CI's
    # plain `pip install` (which ignores uv.lock) pick up a 2.x release and
    # break every test that imports hopper.api at collection time. Bump this
    # only alongside an actual migration of those call sites to the 2.x API.
    "mcp>=1.0.0,<2.0.0",
    # DID signing for upstream sync
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
server = [
    # HTTP server
    # <0.137.0: fastapi redesigned include_router() in 0.137 to wrap an
    # included APIRouter in a lazy fastapi.routing._IncludedRouter instead of
    # flattening its routes onto app.routes eagerly (bisected directly: 0.136.0
    # still flattens correctly, 0.137.0+ doesn't). Breaks nothing at
    # request-dispatch time as far as tested, but breaks any code (including
    # tests/storage/test_upstream_server_routes.py's route-registration sanity
    # check) that introspects app.routes expecting real APIRoute objects with
    # .path/.methods. An unpinned upper bound let CI's plain `pip install`
    # (which ignores uv.lock) pick up 0.141.1 and make that sanity check see
    # zero registered routes. Same shape as the mcp<2.0.0 pin above — bump
    # only alongside adapting route introspection to the new lazy API.
    "fastapi>=0.104.0,<0.137.0",
    "uvicorn[standard]>=0.24.0",
    # Database (Postgres driver for server mode)
    "psycopg2-binary>=2.9.9",
    # Auth / security middleware
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    # Working memory backend
    "redis>=5.0.0",
    # Episodic / semantic memory
    "opensearch-py>=2.4.0",
    # LLM routing (Phase 4 — placeholder until wired)
    "anthropic>=0.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "types-pyyaml",
    "types-redis",
]

[project.scripts]
hopper = "hopper.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "hopper.__version__"}

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "UP042", # (str, Enum) -> StrEnum changes str(member) semantics; enums feed SQL columns and JSON
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Command modules import Context back from main, so the command-group imports
# must come after its definition.
"src/hopper/cli/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_equality = true

[[tool.mypy.overrides]]
# Server-extra and optional packages — not present in a core install
module = [
    "anthropic",
    "fastapi",
    "redis",
    "mcp",
    "nacl",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
