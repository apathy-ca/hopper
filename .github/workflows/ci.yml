name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,server]"

    - name: Run tests with coverage
      run: |
        pytest --cov=hopper --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,server]"

    - name: Check code formatting with Black
      run: |
        black --check src/ tests/

    - name: Lint with Ruff
      run: |
        ruff check src/ tests/

    # Advisory only: ~380 errors of pre-existing type debt under the strict
    # config (mostly no-untyped-def/no-untyped-call). Ratchet the count down,
    # then drop continue-on-error to make this blocking.
    - name: Type check with mypy
      continue-on-error: true
      run: |
        mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[server]" pip-audit "bandit[toml]"

    - name: Run Bandit security scan
      run: |
        bandit -r src/ --severity-level medium

    # Advisory only: new upstream CVEs shouldn't block unrelated PRs,
    # but the step is visibly marked when findings exist.
    - name: Audit dependencies for known vulnerabilities
      continue-on-error: true
      run: |
        pip-audit --progress-spinner off
